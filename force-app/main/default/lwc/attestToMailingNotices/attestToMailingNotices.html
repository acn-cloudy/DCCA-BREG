<template>
    <div class="notifications-container slds-is-relative">
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <template if:false={isSubmitted}>
            <p class="slds-text-body_regular slds-m-bottom_medium">
                By confirming below, you attest that the notices have been mailed.
                (Please check the checkbox).
            </p>
            <lightning-datatable data={notifications}
                                 columns={columns}
                                 key-field="timeDelivered"
                                 is-loading={isLoading}
                                 onrowselection={handleRowSelect}>

            </lightning-datatable>
            <div class="slds-grid slds-m-top_medium">
                <div class="slds-col_bump-right">
                </div>
                <div>
                    <lightning-button class="slds-m-right_small" label="Cancel" variant="neutral" onclick={handleCancelClicked}></lightning-button>
                    <lightning-button label="Submit and Attest to Mailing"
                                      variant="brand"
                                      disabled={isSubmitDisabled}
                                      onclick={handleSubmit}>
                    </lightning-button>
                </div>
            </div>
        </template>
        <template if:true={isSubmitted}>
            <p class="slds-text-body_regular slds-m-bottom_medium">
                You are about to confirm that you have mailed the notices below.
                To confirm, press the Confirm button.
            </p>
            <lightning-datatable data={selectedRows}
                                 data-id="forConfirmation"
                                 columns={submittedTableColumns}
                                 hide-checkbox-column
                                 class="hide-row-num"
                                 suppress-bottom-bar
                                 key-field="timeDelivered">

            </lightning-datatable>
            <div class="slds-grid slds-m-top_medium">
                <div class="slds-col_bump-right">
                </div>
                <div>
                    <lightning-button class="slds-m-right_small" label="Cancel" variant="neutral" onclick={handleCancelClicked}></lightning-button>
                    <lightning-button label="Confirm" variant="brand" onclick={handleConfirm}></lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
