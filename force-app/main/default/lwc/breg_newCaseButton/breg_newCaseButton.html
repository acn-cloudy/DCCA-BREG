<template>
    <template if:true={isLoading}>
        <div class="slds-grid slds-grid_align-center slds-p-around_large">
            <lightning-spinner size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:false={isLoading}>
        <template if:true={isRefundBlocked}>
            <div class="slds-grid slds-grid_align-center slds-p-around_large">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3 slds-large-size_1-of-2">
                    <div class="slds-notify slds-notify_alert slds-theme_warning slds-theme_alert-texture slds-m-bottom_medium" role="alert">
                        <span class="slds-icon_container slds-icon-utility-warning slds-m-right_x-small" title="Warning">
                            <lightning-icon icon-name="utility:warning" alternative-text="Warning" size="small" variant="inverse"></lightning-icon>
                        </span>
                        <h2 class="slds-text-heading_small">{labels.warning}</h2>
                    </div>

                    <lightning-button label={labels.returnToCases} onclick={handleReturnToCases}></lightning-button>
                </div>
            </div>
        </template>
    </template>
</template>
