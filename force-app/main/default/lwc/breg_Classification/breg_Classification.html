<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <div class="slds-grid slds-grid_vertical-align-end slds-var-m-bottom_small">
                <h2 class="dxp-text-heading-large">{title}</h2>
                &nbsp;
                <c-breg_-help-text-popup
                    label="Learn more"
                    title={helpTextTitle}
                    message={helpTextMessage}
                    size="small"
                    cancel-button-label="Close">
                </c-breg_-help-text-popup>
            </div>
        </lightning-layout-item>
        <template lwc:if={readOnly}>
            <lightning-layout-item size="6" class="form-layout-item">
                <p><lightning-formatted-text value={classificationTypeValue}></lightning-formatted-text></p> </lightning-layout-item
        ></template>
        <template lwc:else>
            <lightning-layout-item size="6" class="form-layout-item">
                <lightning-combobox
                    name="classificationType"
                    label={config.labelOverride2}
                    options={classificationTypeOptions}
                    value={classificationTypeValue}
                    placeholder="Select One"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    required={required}
                    read-only={readOnly}
                ></lightning-combobox>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
