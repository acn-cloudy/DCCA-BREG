<template>
    <lightning-layout lwc:if={showSection} multiple-rows="true" >
        <lightning-layout-item lwc:if={title} size="12" class="form-layout-item">
            <h2 class="dxp-text-heading-large slds-var-m-bottom_small">
                <lightning-formatted-rich-text value={title}></lightning-formatted-rich-text>
            </h2>
        </lightning-layout-item>

        <lightning-layout-item lwc:if={config.labelOverrideLong2} size="12" class="slds-var-m-bottom_medium form-layout-item">
            <p class="slds-text-body_regular">
                <lightning-formatted-rich-text value={config.labelOverrideLong2}></lightning-formatted-rich-text>
            </p>
        </lightning-layout-item>
    </lightning-layout>
</template>
