<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>

        <template lwc:if={readOnly}>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-formatted-rich-text value={mailingStatusValueReadOnly}></lightning-formatted-rich-text>
            </lightning-layout-item>
            <lightning-layout-item lwc:if={showMailingDateField} size="6" class="form-layout-item">
                <lightning-formatted-rich-text value={mailingDateValueReadOnly}></lightning-formatted-rich-text>
            </lightning-layout-item>
        </template>
        <template lwc:else>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-radio-group
                    name="mailingStatus"
                    options={mailingStatusOptions}
                    label="Mailing Plan of Merger"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    value={mailingStatusValue}
                    required={required}
                    read-only={readOnly}
                    disabled={readOnly}
                ></lightning-radio-group>
            </lightning-layout-item>

            <lightning-layout-item lwc:if={showMailingDateField} size="6" class="form-layout-item">
                <lightning-input
                    name="mailingDate"
                    value={mailingDateValue}
                    label="Mailing Date"
                    type="date"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    required={required}
                    read-only={readOnly}
                ></lightning-input>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
