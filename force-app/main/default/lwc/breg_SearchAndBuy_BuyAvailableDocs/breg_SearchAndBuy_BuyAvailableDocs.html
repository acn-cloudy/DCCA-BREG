<template>
    <!-- Buy Available Documents content -->
    <div>
        <div lwc:if={isLoading} class="slds-align_absolute-center">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
        <h1 class="dxp-text-heading-large slds-m-bottom_small slds-m-top_medium">{labels.documentsAvailableToPurchase}</h1>

        <!-- Filter Section -->
        <template lwc:if={showFilters}>
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <label class="slds-form-element__label" for="documentTypeFilter">{labels.documentType}</label>
                    <div class="slds-form-element">
                        <div class="slds-select_container">
                            <select id="documentTypeFilter" class="slds-select" onchange={handleDocumentTypeChange}>
                                <template for:each={documentTypeOptions} for:item="option">
                                    <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-align-middle">
                    <lightning-button variant="brand" label={labels.applyFilters} onclick={handleApplyFilters}> </lightning-button>
                </div>
            </div>
        </template>

        <!-- Documents Available to Purchase Section -->
        <div>
            <lightning-datatable
                class="custom-datatable"
                lwc:ref="buyAvailableDocsDatatable"
                key-field="id"
                data={filteredDocs}
                columns={buyAvailableDocsColumns}
                onrowselection={handleRowSelection}
            >
            </lightning-datatable>
            <div class="note-container slds-grid slds-grid_align-spread slds-m-top_medium">
                <div class="slds-col">
                    <div class="filing-note">
                        <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                        <span>{labels.certifiedCopiesNote}</span>
                    </div>
                </div>
                <div class="slds-col slds-no-flex">
                    <lightning-button variant="brand" label={addToCartLabel} onclick={handleAddToCart} class="slds-m-left_medium"> </lightning-button>
                </div>
            </div>
        </div>

        <!-- Error message -->
        <template if:true={showErrorMessage}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-top_small" role="alert">
                <span class="slds-assistive-text">error</span>
                <h2>
                    <div class="slds-notify__content">
                        <p class="slds-m-right_x-small">{labels.selectDocumentError}</p>
                        <div class="slds-notify__close">
                            <lightning-button-icon icon-name="utility:close" alternative-text="Close" title="Close" onclick={handleCloseError}>
                            </lightning-button-icon>
                        </div>
                    </div>
                </h2>
            </div>
        </template>
    </div>
</template>
