<template>
    <h2 class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
    <lightning-layout multiple-rows="true">
        <!-- Assignment Type -->
        <lightning-layout-item size="12">
            <lightning-combobox
                name="TNTMSMAssignmentType"
                value={TNTMSMAssignmentTypeValue}
                label="Assignment Type"
                options={TNTMSMAssignmentTypeOptions}
                onchange={handleInputChange} onblur={handleInputBlur}
                required={required}
                read-only={readOnly}
                disabled={readOnly}
            ></lightning-combobox>
        </lightning-layout-item>
        <!-- TNTMSM Name -->
        <lightning-layout-item size="12">
            <lightning-input
                name="TNTMSMName"
                value={TNTMSMNameValue}
                label="Name"
                type="text"
                onchange={handleInputChange} onblur={handleInputBlur}
                required={required}
                read-only={readOnly}
            ></lightning-input>
        </lightning-layout-item>
        <!-- Certificate Number -->
        <lightning-layout-item size="12">
            <lightning-input
                name="certificateNumber"
                value={certificateNumberValue}
                label="Certificate Number"
                type="text"
                onchange={handleInputChange} onblur={handleInputBlur}
                required={required}
                read-only={readOnly}
            ></lightning-input>
        </lightning-layout-item>
        <!-- Classification Number -->
        <lightning-layout-item lwc:if={showClassificationType} size="12">
            <lightning-combobox
                name="classificationType"
                label="Classification Number"
                options={classificationTypeOptions}
                value={classificationTypeValue}
                placeholder="Select One"
                onchange={handleInputChange} onblur={handleInputBlur}
                required={required}
                read-only={readOnly}
            ></lightning-combobox>
        </lightning-layout-item>
    </lightning-layout>
</template>
