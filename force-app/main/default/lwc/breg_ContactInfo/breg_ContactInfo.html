<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" large-device-size="6" class="slds-p-right_x-small slds-p-top_x-small">
            <lightning-input
                data-name="FirstName"
                type="text"
                label={labels.BREG_Checkout_FirstName}
                value={contactData.FirstName}
                required
                onblur={handleInputBlur}
            ></lightning-input>
        </lightning-layout-item>
        <lightning-layout-item size="12" large-device-size="6" class="slds-p-right_x-small slds-p-top_x-small">
            <lightning-input
                data-name="LastName"
                type="text"
                label={labels.BREG_Checkout_LastName}
                value={contactData.LastName}
                required
                onblur={handleInputBlur}
            ></lightning-input>
        </lightning-layout-item>
        <template lwc:if={showEmail}>
            <lightning-layout-item size="12" large-device-size="6" class="slds-p-right_x-small">
                <lightning-input data-name="Email" type="email" label={labels.BREG_Checkout_Email} value={contactData.Email} required></lightning-input>
            </lightning-layout-item>
        </template>
        <template lwc:if={showPhone}>
            <lightning-layout-item size="12" large-device-size="6" class="slds-p-right_x-small">
                <lightning-input
                    data-name="Phone"
                    type="tel"
                    label={labels.BREG_Checkout_PhoneNumber}
                    value={contactData.Phone}
                    pattern="[0-9+\- ]*"
                    message-when-pattern-mismatch="Use only numbers, spaces, plus signs, and hyphens"
                    oninput={handlePhoneInput}
                    onblur={handlePhoneBlur}
                    required
                ></lightning-input>
            </lightning-layout-item>
        </template>
    </lightning-layout>
    <template lwc:if={showAddress}>
        <lightning-layout multiple-rows="true">
            <lightning-layout-item size="12">
                <lightning-input
                    data-name="MailingStreet"
                    type="text"
                    label={labels.BREG_Checkout_MailStreet}
                    value={contactData.MailingStreet}
                    onblur={handleInputBlur}
                    required
                ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="6" class="slds-p-right_x-small">
                <lightning-input
                    data-name="MailingCity"
                    type="text"
                    label={labels.BREG_Checkout_MailCity}
                    value={contactData.MailingCity}
                    onblur={handleInputBlur}
                    required
                ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="6">
                <lightning-combobox
                    data-name="country"
                    label={labels.BREG_Checkout_MailCountry}
                    value={countryValue}
                    options={countryOptions}
                    onchange={handleInputChange}
                    required
                ></lightning-combobox>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="6" class="slds-p-right_x-small">
                <lightning-input
                    data-name="MailingPostalCode"
                    type="text"
                    label={labels.BREG_Checkout_MailZipCode}
                    value={contactData.MailingPostalCode}
                    pattern="[0-9\- ]+"
                    message-when-pattern-mismatch="Enter ZIP code using only numbers, spaces, and hyphens"
                    required
                ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="6">
                <lightning-combobox
                    data-name="state"
                    label={labels.BREG_Checkout_MailState}
                    value={stateValue}
                    options={stateOptions}
                    onchange={handleInputChange}
                    required
                ></lightning-combobox>
            </lightning-layout-item> 
        </lightning-layout>
    </template>
</template>
