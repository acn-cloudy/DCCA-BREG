<template>
    <template lwc:if={showSpinner}>
        <div class="exampleHolder">
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </div>
    </template>
    <template lwc:else>
        <div class="slds-grid">
            <lightning-card title={componentTitle} class="slds-align_absolute-center slds-size_1-of-1">
                <lightning-button label={buttonLabel} onclick={handleClick}></lightning-button>
            </lightning-card>
        </div>
    </template>
</template>
