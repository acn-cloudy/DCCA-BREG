<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 lwc:if={title} class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>
        <template lwc:if={readOnly}>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-formatted-text value={dropdownValueReadOnly}></lightning-formatted-text>
            </lightning-layout-item>
        </template>
        <template lwc:else>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-combobox
                    name="dropdown"
                    value={dropdownValue}
                    label={config.labelOverride2}
                    options={options}
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    class="slds-var-m-bottom_small"
                    required={required}
                    read-only={readOnly}
                ></lightning-combobox>
            </lightning-layout-item>

            <lightning-layout-item size="12" class="form-layout-item">
                <div lwc:if={config.labelOverrideLong2} class="slds-var-m-bottom_small">
                    <lightning-formatted-rich-text value={config.labelOverrideLong2}></lightning-formatted-rich-text>
                </div>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
