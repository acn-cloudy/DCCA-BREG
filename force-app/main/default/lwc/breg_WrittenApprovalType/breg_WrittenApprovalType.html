<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>
        
        <template lwc:if={readOnly}>
            <lightning-layout-item size="12" class="form-layout-item slds-var-m-bottom_small">
                <p>
                    <lightning-formatted-text value={readOnlyWrittenApprovalTypeValue}></lightning-formatted-text>
                </p>
            </lightning-layout-item>
        </template>
        <template lwc:else>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-radio-group
                    name="writtenApprovalType"
                    label={writtenApprovalTypeLabel}
                    options={writtenApprovalTypeOptions}
                    value={writtenApprovalTypeValue}
                    onchange={handleInputChange}
                    required={required}
                    disabled={readOnly}
                    read-only={readOnly}
                ></lightning-radio-group>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
