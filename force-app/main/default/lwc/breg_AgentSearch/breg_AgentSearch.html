<template>
    <template lwc:if={isNotGuest}>
        <!-- Search Form -->
        <template if:true={showSearch}>
            <h1 class="dxp-text-heading-xlarge title slds-m-bottom_medium">{labels.title}</h1>
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3 slds-p-right_large">
                    <div class="slds-text-body_regular slds-m-bottom_medium">
                        {labels.description}
                    </div>

                    <div class="slds-text-body_regular slds-m-bottom_medium">
                        {labels.accountNote} <!-- [<a href="#" tabindex="-1" onclick={handleMoreInfoClick}><strong>{labels.moreInfo}</strong></a>]
                        <br/>
                        {labels.signUpLinkText} <a href="https://my.hawaii.gov/individuals/create-a-myhawaii-account/" tabindex="-1" target="_blank"><strong>sign-up for an eHawaii.gov account</strong></a>. -->
                    </div>

                    <div class="slds-text-body_regular slds-m-bottom_medium">
                        {labels.instructions}
                    </div>

                    <!-- Error Message -->
                    <template if:true={showErrorMessage}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                            <span class="slds-assistive-text">{labels.error}</span>
                            <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small">
                                <lightning-icon
                                    icon-name="utility:error"
                                    alternative-text={labels.error}
                                    size="x-small"
                                    variant="inverse"
                                ></lightning-icon>
                            </span>
                            <h2 class="slds-text-heading_small">{labels.mustEnterSearchTerm}</h2>
                            <button
                                class="slds-button slds-button_icon slds-button_icon-small slds-notify__close"
                                title={labels.close}
                                onclick={handleCloseError}
                            >
                                <lightning-icon
                                    icon-name="utility:close"
                                    alternative-text={labels.close}
                                    size="x-small"
                                    variant="inverse"
                                ></lightning-icon>
                                <span class="slds-assistive-text">{labels.close}</span>
                            </button>
                        </div>
                    </template>

                    <!-- Search Input Component -->
                    <c-breg-_-search-input
                        placeholder={labels.placeholder}
                        show-search-button="true"
                        custom-search-types={customSearchTypes}
                        onsearch={handleSearch}
                    ></c-breg-_-search-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-m-around_x-small">
                        <c-breg_-e-l-b_-additional-services></c-breg_-e-l-b_-additional-services>
                    </div>
                </div>
            </div>
        </template>

         <!-- Results Table -->
         <template if:true={showTable}>
             <c-breg-_-agent-search-results-table
                 search-value={searchValue}
                 search-type={searchType}
                 onnewsearch={handleNewSearch}
                 oncontinue={handleContinue}
             ></c-breg-_-agent-search-results-table>
         </template>

        <!-- Modal Window for more info -->
