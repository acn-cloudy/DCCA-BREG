<template>
    <template lwc:if={showTrigger}>
        <button type="button" class="help-text-popup__link" onclick={handleOpenClick}>
            {label}
        </button>
    </template>

    <template lwc:if={isOpen}>
        <section role="dialog" tabindex="-1" class="modal-section slds-modal slds-fade-in-open">
            <div class={modalContainerClass}>
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{resolvedTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-formatted-rich-text value={resolvedMessage}></lightning-formatted-rich-text>
                </div>
                <footer class="slds-modal__footer">
                    <template lwc:if={showNextButton}>
                        <lightning-button variant="brand" label={nextButtonLabel} onclick={handleContinue}></lightning-button>
                    </template>
                    <lightning-button class="slds-m-left_small" variant="neutral" label={cancelButtonLabel} onclick={handleCancel}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="modal-bg slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
