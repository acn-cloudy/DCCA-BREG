<template>
    <lightning-card title={labels.BREG_Annual_SelectPaymentMethodTitle}>
        <div class="slds-p-around_medium">
            <lightning-input
                type="checkbox"
                label={labels.BREG_Annual_PaymentMethod_Credit}
                data-value="credit"
                checked={isCredit}
                onchange={handleMethodChange}
            >
            </lightning-input>

            <lightning-input
                type="checkbox"
                label={labels.BREG_Annual_PaymentMethod_Bank}
                data-value="bank"
                checked={isBank}
                onchange={handleMethodChange}
            >
            </lightning-input>

            <lightning-input
                type="checkbox"
                label={labels.BREG_Annual_PaymentMethod_Subscriber}
                data-value="subscriber"
                checked={isSubscriber}
                onchange={handleMethodChange}
            >
            </lightning-input>

            <div class="slds-m-top_large slds-grid slds-grid_align-spread">
                <lightning-button label={labels.BREG_Cancel} variant="destructive-outline" onclick={handleCancel}></lightning-button>
                <div>
                    <lightning-button
                        label={labels.BREG_Prev}
                        icon-name="utility:chevronleft"
                        class="slds-m-right_small"
                        onclick={handlePrevious}
                    ></lightning-button>
                    <lightning-button
                        label={labels.BREG_Next}
                        icon-name="utility:chevronright"
                        icon-position="right"
                        variant="brand"
                        onclick={handleNext}
                        disabled={isNextDisabled}
                    ></lightning-button>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
