<template>
    <lightning-card title={step2title}>
        <lightning-spinner if:true={isLoading} alternative-text="Loading..." size="large"></lightning-spinner>
        <div class="slds-grid slds-wrap">
            <div class="slds-size_1-of-1 slds-large-size_2-of-3">
                <p class="slds-p-horizontal_small slds-text-body_regular">{stepTitle}</p>
                <template lwc:if={formData}>
                    <c-breg_-registration-dynamic-form
                        form-configuration={formConfiguration}
                        form-data={formData}
                        case-id={caseId}
                        onsave={handleSaveFormEvent}
                        oninputchange={handleFormDataChange}
                        onformupdate={handleFormDataChange}
                        cmp-properties={formComponentProperties}
                        oneditsection={handleEditSectionClick}
                        onaddmember={handleAddMember}
                        end-of-quarter={endOfQuarter}
                        annual-filing-date={annualFilingDate}
                    ></c-breg_-registration-dynamic-form>
                    <div class="btns-wrapper slds-m-top_large slds-grid slds-grid_align-spread">
                        <lightning-button variant="destructive" label="Cancel" onclick={handleCancel}></lightning-button>
                        <div class="sub-btns-wrapper">
                            <lightning-button label="Prev" onclick={handlePrev} class="slds-m-right_small"></lightning-button>
                            <lightning-button variant="brand" label="Next" onclick={handleNext}></lightning-button>
                        </div>
                    </div>
                </template>
            </div>
            <div class="slds-size_1-of-1 slds-large-size_1-of-3 slds-p-around_medium">
                <c-breg-_-tile title={tileTitle}>
                    <div class="slds-theme_alert-texture slds-theme_alert-error slds-p-around_medium slds-text-align_center">
                        <div class="slds-text-body_regular slds-text-color_error">{yearReport}</div>
                        <div class="slds-text-heading_medium slds-text-color_error">{reportDateMessage}</div>
                    </div>
                </c-breg-_-tile>
            </div>
        </div>
        <!--TODO: update after no changes verification will be replaced to Registration dynamic form-->
        <c-breg-_-popup
            visible={showModal}
            title="No Changes?"
            message="Please confirm you didn't make any changes"
            oncontinue={handleModalContinue}
            oncancel={handleModalCancel}
            next-button-label="Confirm"
            cancel-button-label="Return to edit"
        ></c-breg-_-popup>

        <c-breg_-registration-dynamic-form-modal
            lwc:if={showEditSectionModal}
            title={editSectionModalTitle}
            form-configuration={formConfigurationEditModal}
            full-form-config={formConfiguration}
            form-data={formDataEditModal}
            cmp-properties={formComponentPropertiesEditModal}
            oncancel={handelCancelEditSectionModal}
            onsaveform={handelSaveFormEditSectionModal}
        ></c-breg_-registration-dynamic-form-modal>
    </lightning-card>
</template>
