<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 lwc:if={title} class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>

        <lightning-layout-item lwc:if={showHasChangedCheckbox} size="12" class="form-layout-item">
            <lightning-input
                name="hasChanged"
                value={hasChangedValue}
                type="checkbox"
                label={hasChangedCheckboxLabel}
                onchange={handleInputChange}
                checked={hasChangedValue}
                disabled={readOnly}
                read-only={readOnly}
            ></lightning-input>
        </lightning-layout-item>

        <template lwc:if={showFields}>
            <!-- Description -->
            <lightning-layout-item size="12" lwc:if={showDescription} class="form-layout-item slds-m-bottom--small">
                <lightning-formatted-rich-text value={description}></lightning-formatted-rich-text>
            </lightning-layout-item>

            <template lwc:if={editMode}>
                <lightning-layout-item size="12" class="form-layout-item">
                    <lightning-input
                        name="inputText"
                        value={inputTextValue}
                        label={config.labelOverride2}
                        type="text"
                        class="slds-var-m-bottom_small"
                        onchange={handleInputChange}
                        onblur={handleInputBlur}
                        variant={variant}
                        required={required}
                        read-only={readOnly}
                    ></lightning-input>
                </lightning-layout-item>

                <lightning-layout-item size="12" class="form-layout-item">
                    <div lwc:if={config.labelOverrideLong2} class="slds-var-m-bottom_small">
                        <span>{config.labelOverrideLong2}</span>
                    </div>
                </lightning-layout-item>
            </template>
            <template lwc:else>
                <lightning-layout-item size="12" class="form-layout-item">
                    <p><lightning-formatted-text value={readOnlyTextValue}></lightning-formatted-text></p>
                </lightning-layout-item>
            </template>
        </template>
    </lightning-layout>
</template>
