<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>

        <template lwc:if={readOnly}>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-formatted-rich-text value={locationTypeValueReadOnly}></lightning-formatted-rich-text>
                <template lwc:if={showLocationTypeHelpTextReadOnly}>
                    &nbsp;[<c-breg_-help-text-tooltip
                            label="More info"
                            title={helpTextTitleReadOnly}
                            message={helpTextMessageReadOnly}>
                    </c-breg_-help-text-tooltip>]
                </template>
            </lightning-layout-item>
            <lightning-layout-item lwc:if={showFormationStateField} size="12" class="form-layout-item">
                <lightning-formatted-rich-text value={formationStateValueReadOnly}></lightning-formatted-rich-text>
            </lightning-layout-item>
            <lightning-layout-item lwc:if={showFilingDateField} size="12" class="form-layout-item">
                <lightning-formatted-rich-text value={filingDateValueReadOnly}></lightning-formatted-rich-text>
            </lightning-layout-item>
        </template>
        <template lwc:else>
            <lightning-layout-item size="12" class="form-layout-item">
                <!-- Location Type -->
                <c-breg_-radio-group-with-help
                    name="locationType"
                    label={config.labelOverride2}
                    options={locationTypeOptions}
                    value={locationTypeValue}
                    required={required}
                    disabled={readOnly}
                    read-only={readOnly}
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                ></c-breg_-radio-group-with-help>
            </lightning-layout-item>
            <lightning-layout-item lwc:if={showFormationStateField} size="12" class="form-layout-item">
                <lightning-input
                    name="formationState"
                    value={formationStateValue}
                    label="The State, Province, or Country of Formation is:"
                    type="text"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    required={required}
                    read-only={readOnly}
                ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item lwc:if={showFilingDateField} size="12" class="form-layout-item">
                <lightning-input
                    name="filingDate"
                    value={filingDateValue}
                    label={filingDateLabel}
                    type="date"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    required={required}
                    read-only={readOnly}
                ></lightning-input>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
