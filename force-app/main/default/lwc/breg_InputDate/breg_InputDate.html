<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 lwc:if={title} class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>

        <lightning-layout-item lwc:if={showHasChangedCheckbox} size="12" class="form-layout-item">
            <lightning-input
                name="hasChanged"
                value={hasChangedValue}
                type="checkbox"
                label={hasChangedCheckboxLabel}
                onchange={handleInputChange}
                checked={hasChangedValue}
                disabled={readOnly}
                read-only={readOnly}
            ></lightning-input>
        </lightning-layout-item>

        <lightning-layout-item size="12" lwc:if={showDescription} class="form-layout-item slds-m-bottom--small">
            <lightning-formatted-rich-text value={description}></lightning-formatted-rich-text>
        </lightning-layout-item>
        
        <!-- Read-only mode -->
        <template lwc:if={readOnly}>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-formatted-rich-text value={readOnlyInputDateValue}></lightning-formatted-rich-text>
            </lightning-layout-item>
        </template>
        <!-- Edit mode -->
        <template lwc:else>
            <lightning-layout-item size="6" class="form-layout-item">
                <lightning-input
                    name="inputDate"
                    value={inputDateValue}
                    label={inputDateLabel}
                    type="date"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    required={required}
                    read-only={readOnly}
                ></lightning-input>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
