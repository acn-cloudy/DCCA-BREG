<template>
    <lightning-card title={cardTitle} icon-name="utility:table">
        <!-- Loading Spinner -->
        <div if:true={isLoading} class="slds-is-relative slds-p-vertical_large">
            <lightning-spinner alternative-text="Searching..." size="medium"></lightning-spinner>
        </div>

        <!-- Search Results Content -->
        <div if:false={isLoading} class="slds-p-horizontal_small">
            <!-- Search Status Messages -->
            <div if:true={showStatusMessage} class="slds-m-bottom_medium">
                <div if:true={showErrorMessage} class="slds-notify slds-notify_toast slds-theme_error">
                    <span class="slds-assistive-text">Error</span>
                    <lightning-icon icon-name="utility:error" alternative-text="Error" size="x-small" class="slds-m-right_x-small"> </lightning-icon>
                    {errorMessage}
                </div>

                <div if:true={showNoResults} class="slds-notify slds-notify_toast slds-theme_warning">
                    <span class="slds-assistive-text">Warning</span>
                    <lightning-icon icon-name="utility:warning" alternative-text="Warning" size="x-small" class="slds-m-right_x-small"> </lightning-icon>
                    No results found. Try adjusting your search criteria.
                </div>
            </div>

            <!-- Results Table -->
            <div if:true={hasResults}>
                <!-- Results Summary -->
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <div class="slds-text-body_small slds-text-color_weak">Showing {pageInfo} results</div>
                </div>

                <!-- Data Table -->
                <lightning-datatable
                    key-field="id"
                    data={paginatedResults}
                    columns={columns}
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    onsort={handleSort}
                    hide-checkbox-column
                    max-row-selection="0"
                    class="results-table"
                >
                </lightning-datatable>

                <!-- Pagination Controls -->
                <div class="slds-m-top_medium">
                    <!-- Page Size Selector -->
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-grid_vertical-align-center">
                        <div class="slds-text-body_small slds-text-color_weak">Showing {pageInfo}</div>
                        <!-- Pagination Navigation -->
                        <div lwc:if={showPagination} class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                            <lightning-button
                                icon-name="utility:chevronleft"
                                title="Previous Page"
                                variant="border-filled"
                                onclick={handlePreviousPage}
                                disabled={notHasPreviousPage}
                                class="slds-m-right_small"
                            >
                            </lightning-button>

                            <span class="slds-text-body_regular slds-m-horizontal_medium"> Page {currentPage} of {totalPages} </span>

                            <lightning-button
                                icon-name="utility:chevronright"
                                title="Next Page"
                                variant="border-filled"
                                onclick={handleNextPage}
                                disabled={notHasNextPage}
                                class="slds-m-left_small"
                            >
                            </lightning-button>
                        </div>
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <span class="slds-text-body_small slds-m-right_x-small">Items per page:</span>
                            <lightning-combobox
                                name="pageSize"
                                value={pageSizeDisplayValue}
                                placeholder="Select page size"
                                options={pageSizeOptions}
                                onchange={handlePageSizeChange}
                                variant="label-hidden"
                                class="page-size-selector"
                            >
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div if:true={showEmptyState} class="slds-text-align_center slds-p-vertical_large">
                <lightning-icon icon-name="utility:search" alternative-text="Search" size="large" class="slds-m-bottom_small"> </lightning-icon>
                <div class="slds-text-heading_medium slds-m-bottom_small">Ready to Search</div>
                <div class="slds-text-body_regular slds-text-color_weak">Enter a business name and select your search criteria to get started.</div>
            </div>
        </div>
    </lightning-card>
</template>
