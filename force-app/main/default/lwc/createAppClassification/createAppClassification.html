<template>
    <div if:true={isLoading} class="slds-align_absolute-center">
        <lightning-spinner variant="brand" size="large" alternative-text="Saving...">
        </lightning-spinner>
    </div>
    <header class="slds-modal__header">
        <h2 class="slds-text-heading_medium slds-hyphenate header-string">
            {header}
        </h2>
        <p class="slds-m-top_x-small modal-hidden">
            <slot name="tagline" onslotchange={handeSlotTaglineChange}></slot>
        </p>
    </header>
    <lightning-record-edit-form object-api-name="ApplicationClassifications__c">
        <lightning-messages>
        </lightning-messages>
        <lightning-input-field data-id="field" field-name="Application__c" value={recordId}>
        </lightning-input-field>
       
        <div class="slds-form-element slds-form-element_stacked">
            <c-x-lookup label="Classification" sobject-name="Classification__c" 
                        fields-to-search="Name" field-list="Name" data-id="lookup"
                        extra-condition={licenseTypeId} required> </c-x-lookup>
        </div>
        <lightning-input-field data-id="field" field-name="EffectiveStartDate__c">
        </lightning-input-field>
        <lightning-input-field data-id="field" field-name="Status__c">
        </lightning-input-field>
        <!--<lightning-input-field data-id="field" field-name="Comments__c">
        </lightning-input-field>-->
    </lightning-record-edit-form>
    <footer class="slds-modal__footer modal-hidden documentFooter">
        <lightning-button label='Add Class' variant="brand" onclick={submit} ></lightning-button>
        <lightning-button label='Cancel'  onclick={cancel} ></lightning-button>
    </footer>
</template>
