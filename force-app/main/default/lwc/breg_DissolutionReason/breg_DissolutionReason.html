<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>

        <template lwc:if={readOnly}>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-formatted-rich-text value={dissolutionReasonValueReadOnly}></lightning-formatted-rich-text>
            </lightning-layout-item>
        </template>
        <template lwc:else>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-checkbox-group
                    name="dissolutionReason"
                    label={config.labelOverride2}
                    options={dissolutionReasonOptions}
                    value={dissolutionReasonValue}
                    onchange={handleInputChange}
                    required={required}
                    disabled={readOnly}
                    read-only={readOnly}
                ></lightning-checkbox-group>
            </lightning-layout-item>
            <template lwc:if={showOtherReasonField}>
                <lightning-layout-item size="12" class="form-layout-item">
                    <lightning-input
                        name="otherReason"
                        value={otherReasonValue}
                        label="Other (please explain):"
                        type="text"
                        onchange={handleInputChange}
                        onblur={handleInputBlur}
                        required={required}
                        read-only={readOnly}
                    ></lightning-input>
                </lightning-layout-item>
            </template>
        </template>
    </lightning-layout>
</template>
