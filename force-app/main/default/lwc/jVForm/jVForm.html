<template>
    <div class="backgroundInverse" if:true={showLoading}>
        <lightning-spinner alternative-text="Loading" variant="inverse"></lightning-spinner>
    </div>
    <lightning-layout horizontal-align="center" class="x-large">
        <lightning-layout-item flexibility="auto" padding="around-small">
            <lightning-layout>
                <lightning-layout-item padding="around-small">
                    <lightning-input type="date" name="input1" autocomplete="off" 
                        label="Start Date" value={startDate} onchange={handleStartDate} ></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small">
                    <lightning-input type="date" name="input1" autocomplete="off" label="End Date"
                        value={cutOffDate} onchange={handleCutOffDate}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small">
                    <lightning-combobox name="fundType" label="Fund Type" value={fundType} options={fundTypeOptions}
                        onchange={handleFundType}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small">
                    <lightning-combobox label="Division" value={division} options={divisionOptions}
                        onchange={handleDivisions}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small">
                    <lightning-combobox label="Payment Type" value={paymentType} options={ptOptions}
                        onchange={handlePT}></lightning-combobox>
                </lightning-layout-item>

            </lightning-layout>
            <lightning-layout horizontal-align="end">
                <lightning-layout-item padding="around-small">
                    <lightning-button variant="brand" label="Run" title="Run" onclick={handleSearch}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" if:true={displayItems}>
                    <lightning-button variant="brand" label="Submit" title="Run" onclick={handleSubmit}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </lightning-layout-item>
            </lightning-layout>
            
            <template for:each={tDRTableFundsList} for:item="tDRTableData" if:true={displayItems}>
                <c-j-v-table key={tDRTableData.length} funds-list={tDRTableData} fund-type={fundType}
                    cut-off-date={cutOffDate}>
                </c-j-v-table>
            </template>

        </lightning-layout-item>
    </lightning-layout>

</template>
