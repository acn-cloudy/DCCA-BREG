<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>
        <template lwc:if={readOnly}>
            <lightning-layout-item size="12" class="form-layout-item">
                <p><lightning-formatted-text value={readOnlyTNTMSMNameValue}></lightning-formatted-text></p>
            </lightning-layout-item>
        </template>
        <template lwc:else>
            <lightning-layout-item size="12" class="form-layout-item" lwc:if={config.labelOverrideLong}>
                <lightning-formatted-rich-text value={config.labelOverrideLong}></lightning-formatted-rich-text>
            </lightning-layout-item>

            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-input
                    name="TNTMSMName"
                    value={TNTMSMNameValue}
                    label="Name"
                    type="text"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    class="slds-var-m-top_medium"
                    required={required}
                    read-only={readOnly}
                ></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item lwc:if={showFooterTitleT1} size="12" class="form-layout-item">
                <div class="slds-var-m-bottom_small">
                    <span>{footerTitleT1}</span>
                </div>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
