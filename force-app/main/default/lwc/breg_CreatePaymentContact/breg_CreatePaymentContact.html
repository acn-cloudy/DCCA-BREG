<template>
    <lightning-card title={labels.BREG_Annual_ContactInfoCardTitle}>
        <div class="slds-p-around_medium">
            <!-- Contact information section -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <lightning-record-edit-form
                object-api-name="Account"
                record-type-id={personAccountRecordTypeId}
                onsuccess={handleSuccess}
                onsubmit={handleSubmit}
            >
                <h2 class="slds-text-heading_small slds-border_bottom">{labels.BREG_Annual_ContactInfoSectionTitle}</h2>
                <div class="slds-grid slds-wrap slds-m-around_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input-field field-name="FirstName"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input-field field-name="LastName"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input-field field-name="PersonEmail"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input-field field-name="PersonPhone"></lightning-input-field>
                    </div>
                </div>

                <lightning-input
                    type="checkbox"
                    class="slds-m-top_small"
                    label={labels.BREG_Annual_SendAlertCheckbox}
                    checked={sendAlert}
                    onchange={handleChange}
                    data-id="sendAlert"
                >
                </lightning-input>

                <!-- Address section -->
                <h2 class="slds-text-heading_small slds-border_bottom slds-m-top_large">{labels.BREG_Annual_AddressSectionTitle}</h2>
                <div class="slds-m-vartical_medium">
                    <lightning-input-field field-name="PersonMailingAddress"></lightning-input-field>
                </div>

                <div class="slds-m-top_large slds-grid slds-grid_align-spread">
                    <lightning-button variant="destructive" label={labels.BREG_Cancel} onclick={handleCancel}></lightning-button>
                    <div>
                        <lightning-button variant="neutral" label={labels.BREG_Prev} class="slds-m-right_small" onclick={handlePrev}></lightning-button>
                        <lightning-button type="submit" variant="brand" label={labels.BREG_Annual_Submit}></lightning-button>
                    </div>
                </div>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
