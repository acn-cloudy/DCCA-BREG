<template>
    <lightning-modal-header label={header}></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-text-align_center">{message}</p>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label={cancelLabel} onclick={handleCancel}></lightning-button>
        <lightning-button label={confirmLabel} variant="destructive" onclick={handleConfirm} class="slds-m-left_small"></lightning-button>
    </lightning-modal-footer>
</template>
