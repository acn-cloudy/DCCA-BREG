<template>
    <lightning-layout multiple-rows="true">
        <lightning-layout-item size="12" class="form-layout-item">
            <h2 class="dxp-text-heading-large slds-var-m-bottom_small">{title}</h2>
        </lightning-layout-item>

        <template lwc:if={readOnly}>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-formatted-rich-text value={firstUsedAnywhereValueReadOnly}></lightning-formatted-rich-text>
            </lightning-layout-item>
            <lightning-layout-item size="12" class="form-layout-item">
                <lightning-formatted-rich-text value={firstUsedHawaiiValueReadOnly}></lightning-formatted-rich-text>
            </lightning-layout-item>
        </template>
        <template lwc:else>
            <lightning-layout-item size="6" class="form-layout-item">
                <lightning-input
                    name="firstUsedAnywhere"
                    value={firstUsedAnywhereValue}
                    type="date"
                    label="Anywhere"
                    placeholder="Select one"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    required={required}
                    read-only={readOnly}
                ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="6" class="form-layout-item">
                <lightning-input
                    name="firstUsedHawaii"
                    value={firstUsedHawaiiValue}
                    type="date"
                    label="Hawaii"
                    placeholder="Select One"
                    onchange={handleInputChange}
                    onblur={handleInputBlur}
                    required={required}
                    read-only={readOnly}
                ></lightning-input>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
