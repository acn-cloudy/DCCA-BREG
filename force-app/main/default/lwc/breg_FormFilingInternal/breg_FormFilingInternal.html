<template>
    <div class="slds-card nbr-internal-container">
        <div class="slds-card__body slds-card__body_inner">
            <lightning-layout horizontal-align="spread" pull-to-boundary="small" vertical-align="start" multiple-rows="true">
                <lightning-spinner if:true={isLoading} alternative-text="Loading..." size="large"></lightning-spinner>
                
                <!-- Form Filling -->
                <template lwc:if={formDataStep}>
                    <lightning-layout-item size="12" padding="around-small">
                        <div class="slds-var-m-bottom_medium">
                            <h1 class="dxp-text-heading-xlarge">{dynamicFormsHeaderTitle}</h1>
                        </div>
                        <p class="slds-var-p-bottom_large">
                            <lightning-formatted-rich-text value={dynamicFormsHeaderDescription}></lightning-formatted-rich-text>
                        </p>
                        <span class="text-italic color-grey slds-var-p-bottom_large">All fields are required unless otherwise noted as &apos;Optional&apos;</span>
                    </lightning-layout-item>
                    <template lwc:if={formData}>
                        <lightning-layout-item size="12" padding="around-small">
                            <c-breg_-registration-dynamic-form
                                form-configuration={formConfiguration}
                                form-data={formData}
                                case-id={caseId}
                                onsave={handleSaveForm}
                                oninputchange={handleFormDataChange}
                                cmp-properties={componentProperties}
                            ></c-breg_-registration-dynamic-form>
                        </lightning-layout-item>
                    </template>
                </template>

                <!-- Navigation Buttons -->
                <lightning-layout-item size="12" padding="around-small">
                    <template lwc:if={formDataStep}>
                        <template lwc:if={formFillingStep}>
                            <lightning-button
                                variant="brand"
                                label="Review"
                                class="slds-var-m-right_small"
                                onclick={handleReview}
                            ></lightning-button>
                            <lightning-button 
                                variant="bare" 
                                label="Save" 
                                class="btn-draft slds-var-m-right_small" 
                                onclick={handleSave}
                            ></lightning-button>
                        </template>
                        <template lwc:else>
                            <lightning-button
                                variant="brand"
                                label="Confirm"
                                class="slds-var-m-right_small"
                                onclick={handleConfirm}
                            ></lightning-button>
                        </template>

                        <!-- <lightning-button 
                            variant="neutral"
                            label="Cancel"
                            class="btn-cancel slds-var-m-right_small"
                            onclick={handleCancel}
                        ></lightning-button> -->
                        <lightning-button 
                            variant="neutral"
                            label="Back"
                            onclick={handleBack}
                        ></lightning-button>
                    </template>
                </lightning-layout-item>
            </lightning-layout>
        </div>
    </div>
</template>
