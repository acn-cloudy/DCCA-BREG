<template>
    <lightning-datatable
        key-field={keyField}
        data={pagedData}
        columns={columns}
        hide-checkbox-column={hideCheckboxColumn}
    ></lightning-datatable>
    <div if:true={showPagination} class="slds-m-top_medium">
        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-grid_vertical-align-center">
            <div class="slds-text-body_small slds-text-color_weak">Showing {pageInfo}</div>
            <div lwc:if={showPagination} class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                <lightning-button
                    icon-name="utility:chevronleft"
                    title="Previous Page"
                    variant="border-filled"
                    onclick={handlePrevious}
                    disabled={isFirstPage}
                    class="slds-m-right_small"
                ></lightning-button>
                <span class="slds-text-body_regular slds-m-horizontal_medium">Page {currentPage} of {totalPages}</span>
                <lightning-button
                    icon-name="utility:chevronright"
                    title="Next Page"
                    variant="border-filled"
                    onclick={handleNext}
                    disabled={isLastPage}
                    class="slds-m-left_small"
                ></lightning-button>
            </div>
            <div class="slds-grid slds-grid_vertical-align-center">
                <span class="slds-text-body_small slds-m-right_x-small">Items per page:</span>
                <lightning-combobox
                    name="pageSizeSelect"
                    value={pageSizeString}
                    placeholder="Select page size"
                    options={pageSizeOptions}
                    onchange={handlePageSizeChange}
                    variant="label-hidden"
                    class="page-size-selector"
                ></lightning-combobox>
            </div>
        </div>
    </div>
</template>
