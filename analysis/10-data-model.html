<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DCCA Salesforce Data Model</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --purple:#A100FF; --dpurple:#7500C0; --xpurple:#460073; --lpurple:#E6DCFF; --gray:#818180; --mgray:#CFCFCF; --lgray:#F1F1EF; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Graphik, Calibri, "Segoe UI", Arial, sans-serif; color:#000; background:#FFF; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:1px solid var(--mgray); }
  header h1 { margin:0; font-size:22px; font-weight:600; }
  header .crumb { font-size:11px; color:var(--gray); margin-bottom:2px; }
  .logo { font-weight:600; font-size:18px; letter-spacing:-.3px; }
  .logo span { color:var(--purple); }
  .wrap { display:flex; min-height:calc(100vh - 70px); }
  nav { width:270px; flex:none; border-right:1px solid var(--mgray); padding:16px 0; background:#FFF; position:sticky; top:0; align-self:flex-start; max-height:100vh; overflow:auto; }
  nav .sec { font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:.6px; padding:12px 20px 6px; }
  nav button { display:flex; justify-content:space-between; width:100%; border:0; background:none; text-align:left; padding:8px 20px; font:inherit; font-size:14px; cursor:pointer; border-left:4px solid transparent; }
  nav button:hover { background:var(--lgray); }
  nav button.active { border-left-color:var(--purple); font-weight:600; background:var(--lgray); }
  nav button .n { color:var(--gray); font-weight:400; font-size:12px; }
  main { flex:1; padding:24px 32px 60px; min-width:0; }
  h2 { font-size:24px; font-weight:600; margin:0 0 4px; }
  h3 { font-size:16px; font-weight:600; margin:28px 0 10px; }
  .desc { color:#333; margin:0 0 18px; max-width:900px; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin:6px 0 20px; }
  .stat { background:var(--lgray); border-left:4px solid var(--purple); padding:10px 16px; min-width:140px; }
  .stat b { display:block; font-size:24px; font-weight:600; }
  .stat span { font-size:12px; color:#333; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .toolbar button { border:1px solid var(--mgray); background:#FFF; padding:4px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .toolbar button:hover { border-color:var(--purple); }
  .legend { font-size:12px; color:#333; display:flex; gap:18px; flex-wrap:wrap; margin-left:auto; }
  .legend i { display:inline-block; width:34px; height:0; border-top:2px solid var(--gray); vertical-align:middle; margin-right:6px; }
  .legend i.dash { border-top-style:dashed; }
  .diagram { border:1px solid var(--mgray); overflow:auto; max-height:78vh; background:#FFF; padding:12px; }
  .diagram svg { max-width:none !important; height:auto; }
  .diagram pre { white-space:pre-wrap; font-size:12px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { text-align:left; font-weight:600; border-bottom:2px solid #000; padding:6px 8px; position:sticky; top:0; background:#FFF; cursor:pointer; white-space:nowrap; }
  td { border-bottom:1px solid var(--mgray); padding:6px 8px; vertical-align:top; }
  td.num, th.num { text-align:right; }
  td.rels { color:#333; font-size:12px; max-width:520px; }
  code { font-family: Consolas, Menlo, monospace; font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border:1px solid var(--mgray); color:#333; white-space:nowrap; }
  .tag.zero { border-color:var(--purple); color:var(--dpurple); }
  .search { border:1px solid var(--mgray); padding:7px 10px; font:inherit; width:340px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
  .card { background:var(--lgray); border-left:4px solid var(--purple); padding:12px 16px; }
  .card h4 { margin:0 0 6px; font-size:14px; font-weight:600; color:var(--dpurple); }
  .card ul { margin:0; padding-left:18px; font-size:12px; overflow-wrap:anywhere; }
  .note { font-size:12px; color:var(--gray); margin-top:8px; }
  footer { position:fixed; left:12px; bottom:6px; color:var(--purple); font-weight:700; font-size:20px; }
  .hidden { display:none; }
</style>
</head>

      <h3>Custom settings &amp; logs (${grp('Custom object').length})</h3>${objTable(grp('Custom object'))}
      <h3>Custom metadata types (${grp('Custom metadata').length})</h3>${objTable(grp('Custom metadata'))}
      <h3>Platform events (${grp('Platform event').length})</h3>${objTable(grp('Platform event'))}`;
    m.innerHTML = h; sortable(m); return;
  }
  const dg = DATA.diagrams[p];
  const nrel = rows.reduce((a, r) => a + r.out, 0);
  h = `<h2>${esc(d.name)}</h2><p class="desc">${esc(d.desc)}</p>
    <div class="stats"><div class="stat"><b>${rows.length}</b><span>objects</span></div><div class="stat"><b>${nrel}</b><span>outbound relationship fields</span></div>
    <div class="stat"><b>${DATA.inbound[p] || 0}</b><span>lookups in from other domains</span></div><div class="stat"><b>${dg.external.length}</b><span>objects from other domains shown</span></div></div>`;
  if (p === 'core') {
    h += `<div class="grid2">${['Account','Contact','Case'].map(o => { const s = DATA.std[o]; return `<div class="card"><h4>${o}</h4>
      <div style="font-size:13px">${s.fields} fields (${s.custom} custom) · ${s.recordTypes.length} record types</div>
      <ul style="margin-top:6px">${s.recordTypes.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>`; }).join('')}</div>
      <p class="note">Person Accounts are enabled (Account carries <code>__pc</code> contact fields). Account.ParentId links General Partnerships (G5/G6) to their LLP parent (K5/K6).</p><h3>Core relationships</h3>`;
  }
  h += diagramBlock('d_' + p);
  if (p === 'core') {
    h += `<h3>Objects that look up to Account, Contact and Case</h3>` + ['Account','Contact','Case'].map(o => {
      const g = DATA.core_inbound[o]; const total = Object.values(g).reduce((a, v) => a + v.length, 0);
      return `<h3 style="font-size:14px;margin-top:18px">${o}: ${total} inbound relationship fields</h3><div class="grid2">${Object.entries(g).map(([k, v]) =>
        `<div class="card"><h4>${esc(k)} (${v.length})</h4><ul>${v.map(x => `<li><code>${esc(x)}</code></li>`).join('')}</ul></div>`).join('')}</div>`; }).join('');
  }
  h += `<h3>Objects in this domain</h3>${objTable(rows)}`;
  m.innerHTML = h; sortable(m); renderMermaid($('#d_' + p), dg.code);
}
buildNav(); show(location.hash.slice(1) || 'overview');
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) history.replaceState(null, '', '#' + b.dataset.p); });
</script>
</body>
</html>
